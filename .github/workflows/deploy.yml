name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Disable worker-route wrangler.toml for Pages deploy
        run: |
          if [ -f wrangler.toml ] && grep -qE '^\[\[routes\]\]|^routes\s*=' wrangler.toml; then
            mv wrangler.toml wrangler.toml.worker-routes-disabled
          fi
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN_GILLIS: ${{ secrets.CF_API_TOKEN_GILLIS }}
        run: |
          TOKEN="${CLOUDFLARE_API_TOKEN:-$CF_API_TOKEN_GILLIS}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudflare token on this repo. Add CLOUDFLARE_API_TOKEN (Pages Edit, Gillis account) and grant this repo."
            exit 1
          fi
          CLOUDFLARE_API_TOKEN="$TOKEN" npx wrangler@3.90.0 pages deploy dist --project-name=silverback-site --branch=main
